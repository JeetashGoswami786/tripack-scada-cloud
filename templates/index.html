<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ section_name }} - Master SCADA</title>
    <meta name="description" content="Industrial SCADA HMI Dashboard — Real-time energy monitoring">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        html, body {
            background-color: #eef1f5 !important;
            color: #1a2332 !important;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth; /* Essential for Anchor Scrolling */
        }
        .history-controls { display: grid; grid-template-columns: auto auto auto; gap: 20px; align-items: start; background: #1a2332; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #2C4A6E; }
        .export-btn { padding: 9px 15px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Inter'; font-size: 13px; color: white; }
        .export-btn.csv { background: #10B981; }
        .export-btn.csv:hover { background: #059669; }
        .export-btn.pdf { background: #EF4444; }
        .export-btn.pdf:hover { background: #DC2626; }

        /* Layout Wrappers */
        .page-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { 
            width: 260px; 
            background: #1a2332; 
            color: white; 
            overflow-y: auto; 
            transition: 0.3s;
            flex-shrink: 0;
        }
        .sidebar.closed { margin-left: -260px; }
        .sidebar-header { padding: 20px; font-weight: 700; border-bottom: 1px solid #2C4A6E; color: #8098B4; }
        .sidebar-list { list-style: none; padding: 0; margin: 0; }
        .sidebar-list li a { 
            display: block; padding: 12px 20px; color: #d1d5db; 
            text-decoration: none; font-size: 13px; border-bottom: 1px solid #253347;
        }
        .sidebar-list li a:hover { background: #253347; color: white; }

        /* Content Area */
        .main-view { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* Hamburger Button */
        .hamburger { 
            background: #2C4A6E; color: white; border: none; padding: 10px 15px; 
            cursor: pointer; font-size: 18px; border-radius: 4px; margin-right: 15px;
        }

        /* Tab Navigation */
        .view-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #2C4A6E; padding-bottom: 10px; }
        .tab-btn { background: transparent; color: #8098B4; border: none; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; padding: 10px 20px; border-radius: 4px; transition: 0.2s; }
        .tab-btn:hover { background: rgba(255,255,255,0.05); }
        .tab-btn.active { background: #008FD5; color: white; }

        /* History View Controls */
        .history-controls { background: #1a2332; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #2C4A6E; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; font-size: 11px; color: #8098B4; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
        .control-group select { background: #0f1623; color: white; border: 1px solid #2C4A6E; padding: 10px; border-radius: 4px; font-family: 'Inter'; width: 250px; outline: none; }
        
        .machine-checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-height: 150px; overflow-y: auto; padding-right: 10px; }
        .machine-checkbox-grid label { font-size: 12px; color: #d1d5db; display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; text-transform: none; letter-spacing: normal; margin-bottom: 0; }
        .machine-checkbox-grid input[type="checkbox"] { accent-color: #008FD5; cursor: pointer; width: 16px; height: 16px; }

        /* Master Chart */
        .master-chart-container { background: white; padding: 20px; border-radius: 8px; height: 500px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .loading-history { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #8098B4; font-weight: 600; }
    </style>

    <link rel="stylesheet" href="/static/css/animations.css?v=3">
    <link rel="stylesheet" href="/static/css/hmi_styles.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header class="scada-header" id="scada-header">
        <div class="header-left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <div class="logo-container">
                <img src="/static/img/logo.png" alt="Tri-Pack Logo" class="header-logo">
            </div>
            <div class="header-title-group">
                <h1 class="header-title">LINE 5 · SUB STATION 3</h1>
                <span class="header-subtitle">MASTER ENERGY DASHBOARD</span>
            </div>
        </div>
        <div class="header-right">
            <div class="header-info-block"><span class="info-label">SYSTEM TIME</span><span class="info-value" id="live-clock">--:--:--</span></div>
            <div class="header-divider"></div>
            <div class="header-info-block"><span class="info-label">UPTIME</span><span class="info-value" id="uptime-counter">00:00:00</span></div>
            <a href="/logout" style="margin-left: 15px; color: #8098B4; font-size: 11px; text-decoration: none; border: 1px solid #2C4A6E; padding: 6px 12px; border-radius: 4px;">LOGOUT</a>
        </div>
    </header>

    <div class="page-wrapper">
        
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">MACHINE DIRECTORY</div>
            <ul class="sidebar-list" id="machine-list">
                </ul>
        </nav>

        <main class="main-view">
            
            <div class="view-tabs">
                <button class="tab-btn active" id="tab-live" onclick="switchTab('live')">Live Dashboard</button>
                <button class="tab-btn" id="tab-history" onclick="switchTab('history')">Historical Analysis</button>
            </div>

            <div id="view-live" class="view-section active">
                <div class="grid-container" id="machine-grid">
                    </div>
            </div>

            <div id="view-history" class="view-section" style="display: none;">
                <div class="history-controls">
                    <div class="control-group">
                        <label>PARAMETER</label>
                        <select id="hist-param" onchange="renderHistoryChart()">
                            <option value="kw">Active Power (kW)</option>
                            <option value="v_l1">Voltage (V)</option>
                            <option value="i_l1">Current (A)</option>
                            <option value="pf">Power Factor</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label>TIME RANGE</label>
                        <select id="hist-timeframe" onchange="fetchHistoryData()">
                            <option value="1h">Last Hour</option>
                            <option value="8h">Last Shift (8 Hours)</option>
                            <option value="24h" selected>Last Day (24 Hours)</option>
                            <option value="7d">Last Week (7 Days)</option>
                            <option value="30d">Last Month (30 Days)</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>REPORTING</label>
                        <div style="display: flex; gap: 10px;">
                            <button class="export-btn csv" onclick="downloadCSV()">⬇ Excel / CSV</button>
                            <button class="export-btn pdf" onclick="downloadPDF()">📄 PDF Report</button>
                        </div>
                    </div>

                    <div class="control-group" style="grid-column: 1 / -1;">
                        <label>COMPARE MACHINES</label>
                        <div id="hist-machine-selectors" class="machine-checkbox-grid">
                            </div>
                    </div>
                </div>
                
                <div class="master-chart-container">
                    <div class="loading-history" id="hist-loader" style="display: none;">Fetching 24h Cloud Data...</div>
                    <canvas id="master-history-chart"></canvas>
                </div>
            </div>

        </main>
    </div>

    <footer class="scada-footer">
        <span class="footer-item">SCADA HMI v2.0 · Modbus TCP/IP Protocol</span>
    </footer>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }

        // Master List of Machines
        const machines = [
            {id: 1, name: "1Q2 F111 (Tape Line)"},
            {id: 2, name: "INCOMING QM1 LVP-07"},
            {id: 3, name: "1Q4 F107 (Chilling of Slitting)"},
            {id: 4, name: "Spare"},
            {id: 5, name: "1Q9 (Crane)"},
            {id: 6, name: "1Q10 F119 (Conveyors)"},
            {id: 7, name: "1Q11 F112 (SS-01)"},
            {id: 8, name: "1Q12 F113 (SS-09)"},
            {id: 9, name: "1Q13 F114 (SS-11)"},
            {id: 10, name: "1Q14 F115 (SS-12)"},
            {id: 11, name: "1Q15 F116 (SS-04)"},
            {id: 12, name: "1Q16 F117 (SS-13)"},
            {id: 13, name: "1Q17 (Additional Slitter 1)"},
            {id: 14, name: "1Q18 (Additional Slitter 2)"},
            {id: 15, name: "1Q19 F129 (Additional Crane)"},
            {id: 16, name: "1Q20 (Material Handling 1)"},
            {id: 17, name: "1Q21 (Material Handling 2)"},
            {id: 18, name: "Bus Coupler"},
            {id: 19, name: "1Q24 F98 (Main Grinder)"},
            {id: 20, name: "UTILITIES 1Q28 F101-A (MCC-08)"},
            {id: 22, name: "1Q30 F105 (SMDB-L3)"},
            {id: 23, name: "1Q31 F106 (SMDB-P3)"},
            {id: 24, name: "1Q32 F99 (PS-07)"},
            {id: 25, name: "1Q33 F100 (Packing Machine)"},
            {id: 28, name: "INOPERATIVE 1Q23 F102 (Erema 04)"},
            {id: 29, name: "INCOMING QM3 LVP-06"},
            {id: 30, name: "1Q26 (Flak/Fluff Silo)"},
            {id: 31, name: "UTILITES 1Q29 F101-B (MCC-09)"}
        ];

        // Inject Sidebar Links
        const list = document.getElementById('machine-list');
        machines.forEach(m => {
            let li = document.createElement('li');
            li.innerHTML = `<a href="#machine-${m.id}">${m.name}</a>`;
            list.appendChild(li);
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>
    <script src="/static/js/scada_engine.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ section_name }} - Master SCADA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link rel="stylesheet" href="/static/css/hmi_styles.css?v=5">
    
    <style>
        /* Premium Light Theme Overrides */
        body { background: #EEF1F5; color: #1E293B; font-family: 'Inter', sans-serif; }
        .scada-header { background: #FFFFFF; border-bottom: 2px solid #E2E8F0; padding: 15px 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .header-title { color: #0F172A; font-weight: 900; }
        .header-subtitle { color: #10B981; font-family: 'JetBrains Mono'; }
        .sidebar { background: #0F172A; color: #F8FAFC; }
        
        /* TABS */
        .view-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px; }
        .tab-btn { background: transparent; color: #64748B; border: none; font-size: 14px; font-weight: 800; cursor: pointer; padding: 10px 20px; border-radius: 6px; transition: 0.2s; text-transform: uppercase; }
        .tab-btn.active { background: #008FD5; color: white; }

        /* VIEW SECTIONS */
        .view-section { display: none; animation: fadeIn 0.3s ease-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

        /* LIGHT CARDS */
        .machine-panel { background: #FFFFFF; border: 1px solid #E2E8F0; border-top: 4px solid #008FD5; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); margin-bottom: 20px; padding: 20px; transition: 0.3s; }
        .machine-panel:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,143,213,0.1); border-top-color: #10B981; }
        .machine-name { color: #0F172A; font-weight: 800; font-size: 18px; margin-left: 10px;}
        
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #F1F5F9; }
        .data-label { color: #64748B; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .data-value { font-family: 'JetBrains Mono'; font-size: 16px; font-weight: 800; color: #0F172A; }
        .data-unit { color: #94A3B8; font-size: 12px; font-weight: 700; margin-left: 4px; }
        
        /* RADAR CONTAINER */
        .radar-box { height: 140px; width: 100%; display: flex; justify-content: center; align-items: center; margin-top: 15px; }

        /* HISTORY CONTROLS */
        .history-controls { display: grid; grid-template-columns: auto auto auto; gap: 20px; background: #FFFFFF; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #E2E8F0; }
        .control-group label { font-size: 11px; color: #64748B; font-weight: 800; margin-bottom: 8px; display: block; }
        .control-group select, .control-group input { background: #F8FAFC; border: 2px solid #E2E8F0; padding: 10px; border-radius: 6px; width: 250px; font-weight: 600; }
        .export-btn { padding: 12px 20px; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; color: white; transition: 0.2s; }
        .export-btn.csv { background: #10B981; }
        .export-btn.pdf { background: #EF4444; }

        .master-chart-container { background: white; padding: 20px; border-radius: 12px; height: 500px; border: 1px solid #E2E8F0; position: relative; }
    </style>
</head>
<body>

    <header class="scada-header">
        <div class="header-left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <img src="/static/img/logo.png" alt="Tri-Pack" style="height: 40px; margin-right: 15px;">
            <div class="header-title-group">
                <h1 class="header-title">{{ section_name }}</h1>
                <span class="header-subtitle">SUBSTATION TELEMETRY</span>
            </div>
        </div>
        <div class="header-right">
            <a href="/" style="color: #64748B; text-decoration: none; border: 2px solid #E2E8F0; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 800;">DISCONNECT</a>
        </div>
    </header>

    <div class="page-wrapper">
        <div class="sidebar" id="sidebar">
            <div style="padding: 20px; font-weight: 800; color: #94A3B8; border-bottom: 1px solid #334155;">NODE DIRECTORY</div>
            <ul class="sidebar-list" id="machine-list" style="list-style: none; padding: 0;"></ul>
        </div>

        <main class="main-view" style="flex: 1; padding: 30px; overflow-y: auto;">
            
            <div class="view-tabs">
                <button class="tab-btn active" id="tab-live" onclick="switchTab('live')">Live Dashboard</button>
                <button class="tab-btn" id="tab-history" onclick="switchTab('history')">Historical Analysis</button>
                <button class="tab-btn" id="tab-heatmap" onclick="switchTab('heatmap')">Substation Heatmap</button>
            </div>

            <div id="view-live" class="view-section active">
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;" id="machine-grid">
                    </div>
            </div>

            <div id="view-history" class="view-section">
                <div class="history-controls">
                    <div class="control-group">
                        <label>PARAMETER</label>
                        <select id="hist-param" onchange="renderHistoryChart()">
                            <option value="kw">Active Power (kW)</option>
                            <option value="v_l1">Voltage L1 (V)</option>
                            <option value="thd_v">Voltage Harmonics (THD-V)</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>TIME RANGE</label>
                        <select id="hist-timeframe" onchange="fetchHistoryData()">
                            <option value="24h">Last 24 Hours</option>
                            <option value="7d">Last 7 Days</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label>REPORTING</label>
                        <div style="display: flex; gap: 10px;">
                            <button class="export-btn csv" onclick="downloadCSV()">⬇ EXCEL / CSV</button>
                            <button class="export-btn pdf" onclick="downloadPDF()">📄 PDF REPORT</button>
                        </div>
                    </div>
                    <div class="control-group" style="grid-column: 1 / -1;">
                        <label>COMPARE MACHINES</label>
                        <div id="hist-machine-selectors" style="display: flex; gap: 15px; flex-wrap: wrap;"></div>
                    </div>
                </div>
                <div class="master-chart-container" id="chart-export-area">
                    <canvas id="master-history-chart"></canvas>
                </div>
            </div>

            <div id="view-heatmap" class="view-section">
                <div class="history-controls" style="grid-template-columns: 1fr;">
                    <div class="control-group">
                        <label>TOTAL SUBSTATION LOAD INTENSITY (kW)</label>
                        <p style="font-size: 13px; color: #64748B;">Aggregated demand across all machines in this sector.</p>
                    </div>
                </div>
                <div class="master-chart-container" style="height: auto;">
                    <div id="apex-heatmap"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const CURRENT_SECTION = "{{ section_id }}";
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('closed'); }
    </script>
    <script src="/static/js/scada_engine.js?v=6"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ machine_name }} - Secure SCADA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #eef1f5; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .header { background: #0f1623; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #10B981; }
        .dashboard-container { padding: 40px; max-width: 600px; margin: 0 auto; }
        .back-btn { color: white; text-decoration: none; border: 1px solid #2C4A6E; padding: 8px 15px; border-radius: 4px; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { background: #2C4A6E; }
        
        /* New Bulletproof Isolated Card CSS */
        .iso-card { background: white; border-radius: 8px; border-top: 4px solid #10B981; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 20px; }
        .iso-header { background: #f8fafc; padding: 15px 25px; border-bottom: 1px solid #e2e8f0; font-weight: 800; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .iso-status { background: #ecfdf5; color: #059669; padding: 4px 10px; border-radius: 4px; font-size: 11px; }
        .iso-body { padding: 25px; }
        .iso-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #f1f5f9; }
        .iso-row:last-child { border-bottom: none; }
        .iso-label { color: #64748b; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
        .iso-val { font-size: 20px; font-weight: 800; color: #0f1623; }
        .iso-unit { font-size: 14px; color: #94a3b8; font-weight: 600; }
        .energy-val { color: #10B981; font-size: 24px; }
        
        .history-btn { background: #10B981; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-weight: 800; width: 100%; font-size: 15px; transition: 0.2s; }
        .history-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 style="margin:0; font-size: 24px;">{{ machine_name }}</h1>
            <span style="font-size: 11px; color: #10B981; letter-spacing: 1px;">SECURE ISOLATED NODE</span>
        </div>
        <a href="/machine_hub" class="back-btn">← Back to Hub</a>
    </div>

    <div class="dashboard-container">
        <div class="iso-card">
            <div class="iso-header">
                <span>LIVE TELEMETRY</span>
                <span class="iso-status" id="conn-status">WAITING FOR DATA...</span>
            </div>
            <div class="iso-body">
                <div class="iso-row">
                    <span class="iso-label">VOLTAGE L1</span>
                    <div><span class="iso-val" id="val-v">---</span> <span class="iso-unit">V</span></div>
                </div>
                <div class="iso-row">
                    <span class="iso-label">CURRENT L1</span>
                    <div><span class="iso-val" id="val-i">---</span> <span class="iso-unit">A</span></div>
                </div>
                <div class="iso-row">
                    <span class="iso-label">ACTIVE POWER</span>
                    <div><span class="iso-val" id="val-kw">---</span> <span class="iso-unit">kW</span></div>
                </div>
                <div class="iso-row">
                    <span class="iso-label">POWER FACTOR</span>
                    <div><span class="iso-val" id="val-pf">---</span></div>
                </div>
                <div class="iso-row" style="background: #f8fafc; padding: 15px; border-radius: 6px; margin-top: 10px; border: 1px solid #e2e8f0;">
                    <span class="iso-label" style="color: #0f1623;">TOTAL ACTIVE ENERGY</span>
                    <div><span class="iso-val energy-val" id="val-kwh">---</span> <span class="iso-unit">kWh</span></div>
                </div>
            </div>
        </div>
        
        <button class="history-btn" onclick="downloadIsolatedCSV()">⬇ DOWNLOAD 24H CSV REPORT</button>
    </div>

    <script>
        const MACHINE_ID = "{{ machine_id }}";

        // Poll Live Data Every 2 Seconds
        setInterval(async () => {
            try {
                const res = await fetch(`/api/live_data/individual_machines`);
                const allData = await res.json();
                
                if (allData[MACHINE_ID]) {
                    const d = allData[MACHINE_ID];
                    document.getElementById('val-v').textContent = d.v_l1 !== undefined ? d.v_l1 : '---';
                    document.getElementById('val-i').textContent = d.i_l1 !== undefined ? d.i_l1 : '---';
                    document.getElementById('val-kw').textContent = d.kw !== undefined ? d.kw : '---';
                    document.getElementById('val-pf').textContent = d.pf !== undefined ? d.pf : '---';
                    document.getElementById('val-kwh').textContent = d.kwh_total !== undefined ? d.kwh_total : '---';
                    
                    document.getElementById('conn-status').textContent = d.status === 'Online' ? '● ONLINE' : '⚠️ OFFLINE';
                    document.getElementById('conn-status').style.color = d.status === 'Online' ? '#059669' : '#ef4444';
                    document.getElementById('conn-status').style.background = d.status === 'Online' ? '#ecfdf5' : '#fef2f2';
                }
            } catch (err) { 
                console.log("Connection lost..."); 
                document.getElementById('conn-status').textContent = "DISCONNECTED";
            }
        }, 2000);

        function downloadIsolatedCSV() {
            window.location.href = `/api/export_csv/individual_machines`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ machine_name }} - Node Telemetry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #050E14; font-family: 'Inter', sans-serif; color: #E2E8F0; min-height: 100vh; display: flex; flex-direction: column; }
        
        .header { background: #0F172A; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1E293B; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .title-block h1 { margin:0; font-size: 24px; font-weight: 900; color: #FFFFFF; }
        .title-block span { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #10B981; letter-spacing: 2px; text-transform: uppercase; }
        
        .back-btn { color: #94A3B8; text-decoration: none; border: 1px solid #334155; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; }
        .back-btn:hover { background: #1E293B; color: #FFFFFF; }

        .main-content { flex: 1; padding: 40px; max-width: 900px; margin: 0 auto; width: 100%; }

        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 15px 25px; background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 8px; }
        .status-label { font-size: 14px; font-weight: 700; color: #A7F3D0; }
        .status-indicator { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 13px; color: #10B981; }
        .status-indicator.offline { color: #EF4444; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #10B981; box-shadow: 0 0 10px #10B981; animation: pulse 2s infinite; }
        .status-dot.offline { background: #EF4444; box-shadow: 0 0 10px #EF4444; animation: none; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        
        .metric-card { background: #0F172A; border: 1px solid #1E293B; border-radius: 12px; padding: 25px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .metric-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #334155; }
        .metric-card.active-power::after { background: #38BDF8; }
        .metric-card.voltage::after { background: #FBBF24; }
        .metric-card.current::after { background: #F87171; }
        
        .metric-label { font-size: 12px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .metric-value-wrapper { display: flex; align-items: baseline; gap: 5px; }
        .metric-val { font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700; color: #F8FAFC; }
        .metric-unit { font-size: 16px; font-weight: 700; color: #94A3B8; }

        .energy-card { background: linear-gradient(135deg, #0F172A 0%, #064E3B 100%); border: 1px solid #059669; border-radius: 12px; padding: 30px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .energy-label { font-size: 16px; font-weight: 800; color: #A7F3D0; text-transform: uppercase; letter-spacing: 1px; }
        .energy-val { font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 700; color: #FFFFFF; text-shadow: 0 0 20px rgba(16,185,129,0.5); }
        .energy-unit { font-size: 20px; color: #6EE7B7; }

        .history-btn { background: #10B981; color: #050E14; border: none; padding: 16px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .history-btn:hover { background: #34D399; box-shadow: 0 0 20px rgba(16,185,129,0.3); }

        /* Small flash animation on data update */
        .flash { animation: flashText 0.5s ease-out; }
        @keyframes flashText { 0% { color: #10B981; } 100% { color: #F8FAFC; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-block">
            <h1>{{ machine_name }}</h1>
            <span>Node ID: {{ machine_id }}</span>
        </div>
        <a href="/machine_hub" class="back-btn">Exit Node</a>
    </div>

    <div class="main-content">
        
        <div class="status-bar">
            <span class="status-label">DATA LINK STATUS</span>
            <div class="status-indicator" id="conn-status-wrap">
                <div class="status-dot" id="conn-dot"></div>
                <span id="conn-text">SYNCING...</span>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card voltage">
                <div class="metric-label">Voltage L1</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val" id="val-v">---</span><span class="metric-unit">V</span>
                </div>
            </div>
            
            <div class="metric-card current">
                <div class="metric-label">Current L1</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val" id="val-i">---</span><span class="metric-unit">A</span>
                </div>
            </div>

            <div class="metric-card active-power">
                <div class="metric-label">Active Power</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val" id="val-kw">---</span><span class="metric-unit">kW</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Power Factor</div>
                <div class="metric-value-wrapper">
                    <span class="metric-val" id="val-pf">---</span>
                </div>
            </div>
        </div>

        <div class="energy-card">
            <div class="energy-label">Total Active Energy</div>
            <div>
                <span class="energy-val" id="val-kwh">---</span> <span class="energy-unit">kWh</span>
            </div>
        </div>
        
        <button class="history-btn" onclick="downloadIsolatedCSV()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download 24H CSV Report
        </button>
    </div>

    <script>
        const MACHINE_ID = "{{ machine_id }}";

        function updateVal(id, newVal) {
            const el = document.getElementById(id);
            if (el.textContent !== String(newVal)) {
                el.textContent = newVal;
                el.classList.remove('flash');
                void el.offsetWidth; // trigger reflow
                el.classList.add('flash');
            }
        }

        setInterval(async () => {
            try {
                const res = await fetch(`/api/live_data/individual_machines`);
                const allData = await res.json();
                
                if (allData[MACHINE_ID]) {
                    const d = allData[MACHINE_ID];
                    
                    updateVal('val-v', d.v_l1 !== undefined ? d.v_l1 : '---');
                    updateVal('val-i', d.i_l1 !== undefined ? d.i_l1 : '---');
                    updateVal('val-kw', d.kw !== undefined ? d.kw : '---');
                    updateVal('val-pf', d.pf !== undefined ? d.pf : '---');
                    updateVal('val-kwh', d.kwh_total !== undefined ? d.kwh_total : '---');
                    
                    const isOnline = d.status === 'Online';
                    document.getElementById('conn-text').textContent = isOnline ? 'ONLINE & SYNCED' : 'OFFLINE';
                    document.getElementById('conn-status-wrap').className = isOnline ? 'status-indicator' : 'status-indicator offline';
                    document.getElementById('conn-dot').className = isOnline ? 'status-dot' : 'status-dot offline';
                }
            } catch (err) { 
                document.getElementById('conn-text').textContent = "DISCONNECTED";
                document.getElementById('conn-status-wrap').className = 'status-indicator offline';
                document.getElementById('conn-dot').className = 'status-dot offline';
            }
        }, 2000);

        function downloadIsolatedCSV() {
            window.location.href = `/api/export_csv/individual_machines`;
        }
    </script>
</body>
</html>

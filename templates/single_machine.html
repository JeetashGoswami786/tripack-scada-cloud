<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ machine_name }} - Secure SCADA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/hmi_styles.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #eef1f5; font-family: 'Inter'; margin: 0; padding: 0; }
        .header { background: #0f1623; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #10B981; }
        .dashboard-container { padding: 40px; max-width: 800px; margin: 0 auto; }
        .back-btn { color: white; text-decoration: none; border: 1px solid #2C4A6E; padding: 8px 15px; border-radius: 4px; font-size: 13px; }
        .history-btn { background: #10B981; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px;}
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1 style="margin:0; font-size: 24px;">{{ machine_name }}</h1>
            <span style="font-size: 11px; color: #10B981;">SECURE ISOLATED NODE</span>
        </div>
        <a href="/machine_hub" class="back-btn">← Back to Hub</a>
    </div>

    <div class="dashboard-container">
        <div class="machine-panel online" id="card" style="width: 100%; max-width: none;">
            <div class="panel-header" style="background: white; padding: 20px;">
                <h2 class="machine-name" style="color: #1a2332;">Live Telemetry</h2>
            </div>
            <div class="panel-body" style="background: white; padding: 20px; display: flex; gap: 40px;">
                <div class="data-column" style="flex: 1;">
                    <div style="display:flex; justify-content:space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <span style="color:#64748b; font-weight:bold; font-size:12px;">VOLTAGE L1</span>
                        <span style="font-weight:bold; font-size:18px;"><span id="val-v">---</span> V</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <span style="color:#64748b; font-weight:bold; font-size:12px;">CURRENT L1</span>
                        <span style="font-weight:bold; font-size:18px;"><span id="val-i">---</span> A</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <span style="color:#64748b; font-weight:bold; font-size:12px;">ACTIVE POWER</span>
                        <span style="font-weight:bold; font-size:18px;"><span id="val-kw">---</span> kW</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <span style="color:#64748b; font-weight:bold; font-size:12px;">POWER FACTOR</span>
                        <span style="font-weight:bold; font-size:18px;"><span id="val-pf">---</span></span>
                    </div>
                    <div style="display:flex; justify-content:space-between; padding-bottom: 10px;">
                        <span style="color:#10B981; font-weight:bold; font-size:12px;">TOTAL ACTIVE ENERGY</span>
                        <span style="color:#10B981; font-weight:bold; font-size:18px;"><span id="val-kwh">---</span> kWh</span>
                    </div>
                </div>
            </div>
        </div>
        
        <br>
        <button class="history-btn" onclick="downloadIsolatedCSV()">⬇ Download 24h CSV Report</button>
    </div>

    <script>
        const MACHINE_ID = "{{ machine_id }}";

        // Poll Live Data Every 2 Seconds
        setInterval(async () => {
            try {
                // Isolated machines push to the "individual_machines" bucket in the cloud
                const res = await fetch(`/api/live_data/individual_machines`);
                const allData = await res.json();
                
                if (allData[MACHINE_ID]) {
                    const d = allData[MACHINE_ID];
                    document.getElementById('val-v').textContent = d.v_l1;
                    document.getElementById('val-i').textContent = d.i_l1;
                    document.getElementById('val-kw').textContent = d.kw;
                    document.getElementById('val-pf').textContent = d.pf;
                    document.getElementById('val-kwh').textContent = d.kwh_total;
                }
            } catch (err) { console.log("Waiting for data..."); }
        }, 2000);

        function downloadIsolatedCSV() {
            window.location.href = `/api/export_csv/individual_machines`;
        }
    </script>
</body>
</html>

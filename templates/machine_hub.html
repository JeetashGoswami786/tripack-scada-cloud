<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ hub_title }} - Tri-Pack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { background: #EEF1F5; font-family: 'Inter', sans-serif; margin: 0; padding: 0; color: #1E293B; }
        .header { background: #FFFFFF; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #E2E8F0; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .logo-small { height: 45px; }
        .title-block h1 { margin: 0; font-size: 24px; font-weight: 900; color: #0F172A; text-transform: uppercase; }
        .title-block span { font-size: 11px; color: #10B981; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        
        .back-btn { color: #475569; text-decoration: none; border: 2px solid #E2E8F0; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; background: #F8FAFC; }
        .back-btn:hover { background: #E2E8F0; color: #0F172A; }

        .main-content { padding: 40px; max-width: 1400px; margin: 0 auto; }
        
        /* THIS GRID FIXES THE ALIGNMENT ISSUES */
        .machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; align-items: stretch; }
        
        .machine-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
        .machine-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,143,213,0.1); border-color: #008FD5; }
        .machine-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #008FD5; transition: 0.3s; }
        .machine-card:hover::before { background: #10B981; }
        
        .machine-title { font-size: 16px; font-weight: 900; color: #0F172A; margin-bottom: 15px; }
        .status-badge { background: #ECFDF5; color: #10B981; border: 1px solid #A7F3D0; padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: 800; display: inline-block; letter-spacing: 1px; }

        .login-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; opacity: 0; pointer-events: none; transition: 0.3s; box-sizing: border-box; }
        .machine-card.active .login-overlay { opacity: 1; pointer-events: auto; }
        
        input[type="password"] { width: 100%; padding: 10px; border: 2px solid #E2E8F0; border-radius: 6px; font-family: 'Inter'; font-weight: 600; text-align: center; outline: none; margin-bottom: 10px; }
        input[type="password"]:focus { border-color: #10B981; }
        .btn-submit { background: #10B981; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-submit:hover { background: #059669; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; font-weight: bold; color: #94A3B8; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="/static/img/logo.png" alt="Tri-Pack" class="logo-small">
            <div class="title-block">
                <h1>{{ hub_title }}</h1>
                <span>{{ hub_subtitle }}</span>
            </div>
        </div>
        <a href="/" class="back-btn">← Back to Master Hub</a>
    </div>

    <div class="main-content">
        <div class="machine-grid">
            {% for m_id, m_data in machines.items() %}
            <div class="machine-card" onclick="openLogin('{{ m_id }}')">
                <div class="machine-title">{{ m_data.name }}</div>
                <div><span class="status-badge">🔒 LOCKED NODE</span></div>
                
                <div class="login-overlay" id="login-{{ m_id }}" onclick="event.stopPropagation()">
                    <span class="close-btn" onclick="closeLogin('{{ m_id }}')">&times;</span>
                    <div style="font-size: 12px; font-weight: 800; color: #64748B; margin-bottom: 10px; text-transform: uppercase;">Authenticate</div>
                    <form action="/login_machine/{{ m_id }}" method="post" style="width: 100%;">
                        <input type="password" name="password" placeholder="Password" required>
                        <button type="submit" class="btn-submit">Unlock</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function openLogin(id) {
            document.querySelectorAll('.machine-card').forEach(c => c.classList.remove('active'));
            document.getElementById('panel-' + id)?.closest('.machine-card').classList.add('active');
            document.getElementById('login-' + id).parentElement.classList.add('active');
        }
        function closeLogin(id) {
            document.getElementById('login-' + id).parentElement.classList.remove('active');
        }
    </script>
</body>
</html>

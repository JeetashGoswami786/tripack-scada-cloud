<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Machines Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f4f8; font-family: 'Inter', sans-serif; margin: 0; padding: 0; color: #1a2332; }
        .header { background-color: #0f1623; color: white; padding: 25px 40px; text-align: center; border-bottom: 4px solid #10B981; }
        .header h1 { margin: 0; font-size: 32px; font-weight: 800; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; padding: 30px 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: 0.2s; border-top: 4px solid #10B981; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2); }
        .card h2 { margin: 0; font-size: 20px; color: #1a2332; }
        .status { margin-top: 15px; display: inline-block; padding: 5px 15px; background: #ecfdf5; color: #059669; border-radius: 20px; font-size: 12px; font-weight: 700; }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; padding: 35px; border-radius: 8px; width: 100%; max-width: 400px; text-align: center; }
        .modal-box input { width: 85%; padding: 12px; margin: 10px 0; border: 2px solid #cbd5e1; border-radius: 6px; font-size: 15px; text-align: center; }
        .modal-btn { background: #10B981; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        .back-btn { position: absolute; top: 25px; left: 40px; color: white; text-decoration: none; font-weight: bold; border: 1px solid white; padding: 8px 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <a href="/dashboard/line5_sub3" class="back-btn">← Back to Plant</a>
        <h1>Isolated Machine Network</h1>
        <p style="opacity: 0.8; letter-spacing: 2px;">TIER 2 ENCRYPTED ACCESS</p>
    </div>

    <div class="grid-container">
        {% for m_id, m_data in machines.items() %}
        <div class="card" onclick="openLogin('{{ m_id }}', '{{ m_data.name }}')">
            <h2>{{ m_data.name }}</h2>
            <span class="status">🔒 Locked Data</span>
        </div>
        {% endfor %}
    </div>

    <div class="modal-overlay" id="login-modal">
        <div class="modal-box">
            <h3 id="modal-title">Machine Auth</h3>
            <p style="font-size: 12px; color: #ef4444;">Requires Specific Machine Credentials</p>
            <form id="login-form" method="POST" action="">
                <input type="text" name="username" placeholder="Machine Username" required>
                <input type="password" name="password" placeholder="Machine Password" required>
                <button type="submit" class="modal-btn">ACCESS DATA</button>
            </form>
            <button onclick="document.getElementById('login-modal').classList.remove('active')" style="background:none; border:none; margin-top:15px; color:#64748b; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        function openLogin(machineId, machineName) {
            document.getElementById('modal-title').textContent = machineName;
            document.getElementById('login-form').action = "/login_machine/" + machineId;
            document.getElementById('login-modal').classList.add('active');
        }
    </script>
<script>
        function openLogin(machineId, machineName) {
            document.getElementById('modal-title').textContent = machineName;
            document.getElementById('login-form').action = "/login_machine/" + machineId;
            document.getElementById('login-modal').classList.add('active');
        }

        // NEW: Check for Access Denied
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error')) {
                alert("❌ ACCESS DENIED: Incorrect Username or Password for this machine.");
                window.history.replaceState(null, '', window.location.pathname); // Clean the URL
            }
        }
    </script>    
</body>
</html>

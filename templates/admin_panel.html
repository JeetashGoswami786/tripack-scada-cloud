<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Password Management</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: var(--primary); margin: 0; font-size: 1.8rem; }
        .logout-btn { background: var(--danger); color: white; padding: 8px 16px; text-decoration: none; border-radius: 5px; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; color: #7f8c8d; text-align: left; padding: 12px; border-bottom: 2px solid #eee; font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #eee; vertical-align: middle; }
        tr:hover { background: #fdfdfd; }
        .entity-name { font-weight: 600; color: var(--primary); display: block; }
        .entity-id { font-size: 0.75rem; color: #95a5a6; }
        .update-form { display: flex; gap: 10px; }
        .update-form input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem; width: 120px; }
        .update-form button { padding: 6px 12px; background: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .update-form button:hover { background: #2980b9; }
        .status-msg { padding: 10px; border-radius: 5px; margin-bottom: 20px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Master Admin Panel</h1>
        <a href="/logout" class="logout-btn">Logout Admin</a>
    </header>

    <div id="feedback" class="status-msg"></div>

    <table>
        <thead>
            <tr>
                <th>Machine / Section Name</th>
                <th>Current Password</th>
                <th>Update New Password</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for item in passwords %}
            <tr>
                <td>
                    <span class="entity-name">{{ item.entity_id }}</span>
                    <span class="entity-id">ID: {{ item.entity_id }}</span>
                </td>
                <td><code>{{ item.password }}</code></td>
                <td>
                    <form class="update-form" onsubmit="handleUpdate(event, '{{ item.entity_id }}')">
                        <input type="text" name="new_password" placeholder="New Password" required>
                        <button type="submit">Save</button>
                    </form>
                </td>
                <td></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    async function handleUpdate(event, entityId) {
        event.preventDefault();
        const form = event.target;
        const newPwd = form.querySelector('input[name="new_password"]').value;
        const feedback = document.getElementById('feedback');

        const formData = new FormData();
        formData.append('entity_id', entityId);
        formData.append('new_password', newPwd);

        try {
            const response = await fetch('/admin/update_password', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();

            if (result.status === 'success') {
                feedback.innerText = "Password updated successfully!";
                feedback.className = "status-msg success";
                setTimeout(() => location.reload(), 1000);
            } else {
                feedback.innerText = "Error: " + result.message;
                feedback.className = "status-msg error";
            }
        } catch (err) {
            feedback.innerText = "Connection error.";
            feedback.className = "status-msg error";
        }
    }
</script>

</body>
</html>
